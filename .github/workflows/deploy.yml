name: Deploy storefront (Cloudflare Workers)

# Manual only: nothing deploys on push. Run it from the Actions tab. `dry_run` (on by default) builds, tests and
# checks everything, then stops before uploading; turn it off to deploy.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check only; do not upload to Cloudflare'
        type: boolean
        default: true

# Never two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-storefront-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest
    # Secrets and variables come from the GitHub environment "production" (Settings -> Environments).
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required settings
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          STOREFRONT_ROOT_URL: ${{ vars.STOREFRONT_ROOT_URL }}
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail=0
          for name in API_BASE_URL STOREFRONT_ROOT_URL EDGE_SHARED_SECRET; do
            if [ -z "${!name:-}" ]; then echo "::error::$name is not set in the production environment"; fail=1; fi
          done
          if [ "$DRY_RUN" != "true" ]; then
            for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
              if [ -z "${!name:-}" ]; then echo "::error::$name is not set in the production environment"; fail=1; fi
            done
          fi
          # The same rules the app enforces at runtime (lib/config.js), checked before anything is uploaded.
          case "$API_BASE_URL" in https://*/v1) ;; *) echo "::error::API_BASE_URL must be https and end in /v1"; fail=1 ;; esac
          case "$STOREFRONT_ROOT_URL" in https://*) ;; *) echo "::error::STOREFRONT_ROOT_URL must be https"; fail=1 ;; esac
          if [ "${#EDGE_SHARED_SECRET}" -lt 32 ]; then echo "::error::EDGE_SHARED_SECRET must be at least 32 characters"; fail=1; fi
          exit "$fail"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Built with a throwaway sentinel as the secret, never the real one, so verify:bundle can prove that no secret,
      # secret header or API address reaches any file the browser downloads. The real secret is only given to the
      # Worker at deploy time.
      - name: Build for Workers and check the browser bundle
        run: |
          set -euo pipefail
          SENTINEL="sentinel-$(openssl rand -hex 24)"
          EDGE_SHARED_SECRET="$SENTINEL" API_BASE_URL=https://api.storekit.site/v1 npm run cf:build
          EDGE_SHARED_SECRET="$SENTINEL" npm run verify:bundle

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          STOREFRONT_ROOT_URL: ${{ vars.STOREFRONT_ROOT_URL }}
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # The secret goes to Cloudflare as an encrypted Worker secret, via a file readable only by this job.
          umask 077
          secrets_file="$RUNNER_TEMP/storefront-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n --arg s "$EDGE_SHARED_SECRET" '{EDGE_SHARED_SECRET: $s}' > "$secrets_file"

          extra=()
          if [ "$DRY_RUN" = "true" ]; then extra+=(--dry-run); fi

          npx opennextjs-cloudflare deploy "${extra[@]}" \
            --var "API_BASE_URL:$API_BASE_URL" \
            --var "STOREFRONT_ROOT_URL:$STOREFRONT_ROOT_URL" \
            --secrets-file "$secrets_file"
